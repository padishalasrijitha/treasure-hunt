<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt Game</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row mt-4">
            <div class="col-12 text-center">
                <h1 class="display-4">Treasure Hunt Game</h1>
                <p class="lead">Find all the hidden treasures!</p>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-8 mx-auto">
                <div class="game-stats mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Treasures Found: <span id="treasures-found">0</span>/<span id="total-treasures">5</span></span>
                        <span>Time: <span id="timer">00:00</span></span>
                    </div>
                </div>
                <div class="game-map" id="game-map">
                    <!-- Game map will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <button id="start-game" class="btn btn-primary">Start Game</button>
                <button id="reset-game" class="btn btn-secondary ms-2">Reset Game</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
